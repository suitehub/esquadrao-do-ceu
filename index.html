button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:#fff}
svg{flex-shrink:0;vertical-align:-3px}
.login{display:grid;min-height:100vh}

.card-login{width:100%;max-width:380px}
.field{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);padding:14px;margin-top:10px;font-size:14px;outline:none}
.field:focus{border-color:var(--cyan)}
.btn-primary{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:linear-gradient(135deg,#009FE3,#0077ff);padding:14px;font-size:14px;font-weight:800;margin-top:14px;box-shadow:0 12px 30px rgba(0,159,227,.4)}
.btn-ghost{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);padding:13px;margin-top:10px;font-weight:700;font-size:14px}
.shell{display:flex;min-height:100vh}
.sidebar{display:none;width:250px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.06);background:#07121c;padding:20px;position:sticky;top:0;height:100vh;flex-direction:column}

.navbtn{display:flex;width:100%;align-items:center;gap:12px;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;color:#8fa0b5;margin-bottom:2px;text-align:left}
.navbtn:hover{background:rgba(255,255,255,.05);color:#fff}
.navbtn.active{background:linear-gradient(90deg,rgba(0,159,227,.3),rgba(0,159,227,.08));color:#fff;box-shadow:inset 0 0 0 1px rgba(0,159,227,.35)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(5,11,17,.9);backdrop-filter:blur(12px)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.search{position:relative;flex:1;max-width:340px;margin-left:auto;display:flex;align-items:center}
.search svg{position:absolute;left:12px;color:#556}
.search input{width:100%;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:10px 14px 10px 36px;font-size:13px;outline:none}
.iconbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
.badge-dot{position:absolute;right:6px;top:6px;min-width:16px;height:16px;border-radius:999px;background:#ef4444;font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(245,184,46,.6)}
.content{max-width:1080px;width:100%;margin:0 auto;padding:20px 16px 110px}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid rgba(255,255,255,.1);background:rgba(7,18,28,.96);backdrop-filter:blur(12px)}
.bottomnav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:8px}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#5b6b80;padding:6px;border-radius:10px}
.bottomnav button.active{color:var(--cyan)}
@media(min-width:1024px){.bottomnav{display:none}}
.hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid rgba(255,255,255,.1);background:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1400&q=80') center/cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#050B11 20%,rgba(5,11,17,.75),rgba(5,11,17,.2))}
.hero-in{position:relative;z-index:1;padding:24px}
@media(min-width:700px){.hero-in{padding:32px}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(10,22,34,.92);padding:16px}
.stat b{font-size:24px}
.stat small{display:block;color:var(--gray);font-size:12px;margin-top:2px}
.up{color:#34d399;font-size:11px;font-weight:700;margin-top:4px}
.panel{border-radius:22px;border:1px solid rgba(255,255,255,.1);background:var(--card);padding:20px;margin-top:20px}
.panel h3{font-size:15px}
.grid2{display:grid;gap:20px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 320px}}
.unitgrid{display:grid;gap:14px;margin-top:14px}
@media(min-width:640px){.unitgrid{grid-template-columns:repeat(3,1fr)}}
.unitcard{overflow:hidden;border-radius:18px;border:1px solid;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);transition:transform .15s;color:#fff}
.unitcard:hover{transform:translateY(-2px)}
.unitcover{position:relative;height:132px;background:#0d1622;overflow:hidden;display:grid;place-items:center}
.unitcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.unitcover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,#000c)}
.ranktag{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.6);border:1px solid rgba(245,184,46,.4);color:var(--gold);font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px;z-index:2}
.unitname{position:absolute;left:0;right:0;bottom:6px;text-align:center;z-index:2}
.unitname b{font-size:17px;letter-spacing:.04em;display:block}
.unitname i{display:block;font-size:11px;color:rgba(255,255,255,.7);font-style:italic}
.unitbody{padding:14px}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:999px}
.rowline{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}
.rowline b{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
.link{color:var(--cyan);font-size:12px;font-weight:800}
.evrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);width:100%;text-align:left;color:#fff}
.evrow:last-child{border-bottom:0}
.datebox{width:46px;min-height:52px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);text-align:center;padding:6px}

.dot{width:10px;height:10px;border-radius:50%;margin-left:auto;flex-shrink:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:14px}

.check.on{background:#10b981;border-color:#6ee7b7;box-shadow:0 0 12px rgba(52,211,153,.6)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;text-align:left;padding:10px 12px;background:rgba(255,255,255,.03)}
.tbl td{padding:12px;border-top:1px solid rgba(255,255,255,.05)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:800;border:1px solid}

.tag.a{background:rgba(245,184,46,.12);color:#fcd34d;border-color:rgba(245,184,46,.4)}
.tag.r{background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.4)}

.cal span.h{font-size:10px;color:#64748b;font-weight:800;padding:6px 0}
.cal button{aspect-ratio:1;border-radius:50%;font-size:12px;font-weight:700;color:#94A3B8}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:20px}
.pcol{display:flex;flex-direction:column;align-items:center;width:110px;color:#fff}
.pbox{width:100%;display:grid;place-items:center;border-radius:20px;border:1px solid;color:#fff}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

.gal img{width:100%;height:110px;object-fit:cover;border-radius:14px}
@media(min-width:640px){.gal img{height:140px}}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.modal{width:100%;max-width:440px;border-radius:22px;border:1px solid rgba(255,255,255,.12);background:#0A1622;padding:20px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#0A1B2A;border:1px solid rgba(56,189,248,.4);box-shadow:0 0 30px rgba(0,159,227,.4);border-radius:999px;padding:10px 20px;font-size:13px;font-weight:800;display:none;white-space:nowrap}

.logo{display:flex;align-items:center;gap:12px}
.logoshield{width:52px;height:52px;flex-shrink:0;display:grid;place-items:center;position:relative;color:#fff}

.ringwrap{display:flex;align-items:center;gap:16px}
textarea.edit{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);padding:12px;font-size:13px;margin-top:10px;min-height:120px;outline:none}
.warbox{margin-top:10px;border:1px solid rgba(245,184,46,.35);background:rgba(245,184,46,.06);border-radius:14px;padding:16px;text-align:center;font-weight:900;color:#fde68a;white-space:pre-line;line-height:1.6}
.kv{font-size:12px;color:var(--gray)}

@media(min-width:1024px){.mini-logo{display:none}}
</style>

var h='<div style="display:flex;gap:8px;margin-top:14px">';['Individuais','Unidade','Conselheiro'].forEach(function(t){h+='<button class="tab '+(S.reqTab===t?'active':'')+'" style="flex:1" onclick="S.reqTab=\''+t+'\';render()">'+t+'</button>'});h+='</div><div class="panel"><div class="kv">Progresso · 86% · 18 de 21</div><div style="margin-top:8px">'+bar(86,'#38BDF8')+'</div>';
arr.forEach(function(t,i){var on=S.checked[S.reqTab+i];h+='<button class="req" onclick="toggleReq(\''+S.reqTab+i+'\')"><span class="check '+(on?'on':'')+'">'+(on?ic('check',13):'')+'</span><span style="color:'+(on?'#fff':'#8fa0b5')+'">'+t+'</span></button>'});
return h+'</div>';
}
function missBox(){
var h='';DB.missions.forEach(function(m){h+='<div class="mission"><span class="pill" style="color:#c4b5fd;border-color:rgba(167,139,250,.4)">'+ic('spark',12)+m.scope+'</span> <span class="pill" style="float:right;color:#fcd34d">'+m.s+'</span><div style="font-weight:900;margin-top:8px">'+m.t+'</div><div class="kv">'+m.d+'</div><div style="margin-top:8px">'+bar(m.p,m.p===100?'#35D07F':'#F5B82E')+'</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><b style="color:var(--gold);font-size:13px;display:inline-flex;gap:5px;align-items:center">'+starF(14,'#F5B82E')+'+'+m.pts+' pontos</b><button class="tab" onclick="toast(\'Progresso registrado\')">Atualizar</button></div></div>'});return h;
}
function vMembros(){
var q=(S.search||'').toLowerCase();
var list=DB.members.filter(function(m){return m.name.toLowerCase().indexOf(q)>=0});
var h='<div style="display:flex;justify-content:space-between;align-items:center"><div><h2 style="font-size:20px;font-weight:900">Desbravadores</h2><p class="kv">'+list.length+' membros no clube</p></div><button class="tab active" onclick="openModal(\'membro\')">+ Adicionar</button></div><div class="cards2">';
list.forEach(function(m){var u=unit(m.unit);h+='<button class="memberrow" style="margin-top:0" onclick="go(\'membro\',{memberId:\''+m.id+'\',unitId:\''+m.unit+'\'})"><img src="'+m.img+'"><span style="flex:1"><b style="font-size:13px">'+m.name+'</b><br><span class="kv">'+m.age+' anos · '+u.short+'</span><br>'+awardPill(m.award)+'</span><span style="text-align:right"><b style="color:var(--cyan)">'+m.progress+'%</b><br><span class="kv">'+m.points+' pts</span></span></button>'});
return h+'</div>';
}
function vMembro(){
var m=member(S.memberId),u=unit(m.unit);
var h='<div class="panel" style="text-align:center"><img src="'+m.img+'" style="width:80px;height:80px;border-radius:50%;border:4px solid rgba(56,189,248,.5)"><h2 style="font-size:20px;font-weight:900;margin-top:8px">'+m.name+'</h2><p class="kv">'+m.role+' | '+m.age+' anos</p><span class="pill" style="margin-top:8px">'+unitIcon(u.id,14)+u.short+'</span></div><div class="panel" style="text-align:center"><h3 style="text-align:left">Progresso geral</h3><div style="display:flex;justify-content:center;margin:10px 0">'+ring(m.progress)+'</div><p class="kv">'+m.done+' de '+m.total+' requisitos concluídos</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;text-align:left">';[['Requisitos',m.progress,'#F5B82E'],['Frequência',m.freq,'#38BDF8'],['Eventos',90,'#35D07F'],['Fardamento',95,'#A78BFA']].forEach(function(r){h+='<div style="background:rgba(255,255,255,.03);border-radius:12px;padding:10px;font-size:12px"><div style="display:flex;justify-content:space-between"><span class="kv">'+r[0]+'</span><b>'+r[1]+'%</b></div>'+bar(r[1],r[2])+'</div>'});h+='</div></div><div class="panel" style="display:flex;gap:12px;align-items:center;border-color:rgba(245,184,46,.3);background:rgba(245,184,46,.05)"><span style="color:var(--gold)">'+ic('medal',34)+'</span><div><div class="kv">Premiação atual</div><b style="color:var(--gold)">'+m.award+' · '+m.points.toLocaleString('pt-BR')+' pontos</b></div></div>'+reqBox();
return h;
}
function vRequisitos(){return '<h2 style="font-size:20px;font-weight:900">Requisitos</h2>'+reqBox()}
function toggleReq(k){S.checked[k]=!S.checked[k];toast(S.checked[k]?'Requisito concluído +10 pts':'Requisito desmarcado');render()}
function vFrequencia(){
var rows=DB.members.slice(0,6);
var h='<div style="display:flex;gap:12px;align-items:center"><div class="datebox"><div><small>05</small><br><b>OUT</b></div></div><div><h2 style="font-weight:900">Frequência</h2><p class="kv">Reunião regular · 05 de outubro · 19:00 | IASD Central</p></div></div><div class="btnrow"><button class="btn2" onclick="markAll()">Marcar todos presentes</button><button class="btn2" style="background:linear-gradient(135deg,#009FE3,#0077ff);border:0" onclick="toast(\'Chamada salva · +100 pts\')">Salvar chamada</button></div><div class="panel" style="overflow-x:auto"><table class="tbl"><tr><th>Desbravador</th><th>Presença</th><th>Fardamento</th></tr>';
rows.forEach(function(m){var f=S.freq[m.id]||{p:'P',u:'C'};h+='<tr><td><div style="display:flex;gap:8px;align-items:center"><img src="'+m.img+'" style="width:32px;height:32px;border-radius:50%">'+m.name+'</div></td><td><button class="tag '+(f.p==='P'?'g':'r')+'" onclick="toggleP(\''+m.id+'\')">'+(f.p==='P'?'Presente':'Ausente')+'</button></td><td><button class="tag '+(f.u==='C'?'g':(f.u==='I'?'a':'r'))+'" onclick="toggleU(\''+m.id+'\')">'+ic('shirt',12)+(f.u==='C'?'Completo':(f.u==='I'?'Incompleto':'—'))+'</button></td></tr>'});
return h+'</table></div><div class="panel"><p class="kv">Fardamento por evento: uniforme, lenço e insígnias. <b style="color:#6ee7b7">Completo</b> · <b style="color:#fcd34d">Incompleto</b> · <b style="color:#fca5a5">Não informado</b></p></div>';
}
function toggleP(id){var f=S.freq[id]||{p:'P',u:'C'};f.p=(f.p==='P'?'A':'P');S.freq[id]=f;render()}
function toggleU(id){var f=S.freq[id]||{p:'P',u:'C'};f.u=(f.u==='C'?'I':'C');S.freq[id]=f;render()}
function markAll(){DB.members.forEach(function(m){S.freq[m.id]={p:'P',u:'C'}});toast('Todos marcados como presentes');render()}
function vAgenda(){
var h='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:20px;font-weight:900">Agenda</h2><button class="iconbtn" style="background:linear-gradient(135deg,#009FE3,#0077ff)" onclick="openModal(\'evento\')">'+ic('plus',18)+'</button></div><div class="panel"><b>Outubro 2026</b><div class="cal"><span class="h">D</span><span class="h">S</span><span class="h">T</span><span class="h">Q</span><span class="h">Q</span><span class="h">S</span><span class="h">S</span><span></span><span></span><span></span>';
var marks={5:'#38BDF8',10:'#35D07F',17:'#A78BFA',24:'#94A3B8'};
for(var d=1;d<=31;d++){if(marks[d]){h+='<button style="color:'+marks[d]+';box-shadow:0 0 0 1.5px '+marks[d]+';background:'+marks[d]+'22;border-radius:50%" onclick="toast(\'Dia '+d+' selecionado\')">'+d+'</button>'}else{h+='<button onclick="toast(\'Dia '+d+'\')">'+d+'</button>'}}
h+='</div><div style="margin-top:12px">';
DB.events.forEach(function(e){h+='<button class="evrow" onclick="go(\'eventos\')"><span class="datebox"><span><small>'+e.day+' '+e.mon+'</small></span></span><span><b style="font-size:13px">'+e.name+'</b><br><span class="kv">'+e.time+' | '+e.place+'</span></span><span class="dot" style="background:'+e.color+'"></span></button>'});
return h+'</div></div>';
}
function vEventos(){
var h='<div style="display:flex;justify-content:space-between;align-items:center"><div><h2 style="font-size:20px;font-weight:900">Eventos</h2><p class="kv">Outubro 2026 · 4 eventos</p></div><button class="tab active" onclick="openModal(\'evento\')">+ Novo evento</button></div>';
DB.events.forEach(function(e){h+='<div class="panel"><div style="display:flex;gap:12px"><div class="datebox"><div><small>'+e.mon+'</small><b>'+e.day+'</b></div></div><div><span class="pill" style="color:'+e.color+'">'+e.type+'</span><div style="font-weight:900;margin-top:4px">'+e.name+'</div><div class="kv">'+ic('clock',12)+' '+e.time+'</div><div class="kv">'+ic('pin',12)+' '+e.place+' · +'+e.pts+' pts</div></div></div><div class="btnrow" style="grid-template-columns:1fr 1fr 1fr"><button class="btn2" onclick="go(\'frequencia\')">Frequência</button><button class="btn2" onclick="go(\'frequencia\')">Fardamento</button><button class="btn2" style="color:#7dd3fc;border-color:rgba(56,189,248,.4)" onclick="toast(\'Pontuação gerada\')">Pontuar</button></div></div>'});
return h;
}
function vMissoes(){return '<h2 style="font-size:20px;font-weight:900">Missões</h2><p class="kv">Temporada 2026 · complete e ganhe pontos</p>'+missBox()}
function vRanking(){
var order=[DB.units[0],DB.units[1],DB.units[2]];
var h='<h2 style="text-align:center;font-size:20px;font-weight:900">Ranking</h2><p class="kv" style="text-align:center">Temporada 2026</p><div class="tabs" style="justify-content:center">';['Geral','Requisitos','Frequência','Eventos','Missões'].forEach(function(f){h+='<button class="tab '+(S.rankF===f?'active':'')+'" onclick="S.rankF=\''+f+'\';render()">'+f+'</button>'});h+='</div><div class="podium">';
var cols=[order[1],order[0],order[2]];
cols.forEach(function(u){var first=(u.rank===1);h+='<button class="pcol" onclick="go(\'unidade\',{unitId:\''+u.id+'\'})"><span class="pill">'+u.rank+'°</span><span class="pbox" style="height:'+(first?130:100)+'px;border-color:'+(first?'rgba(245,184,46,.5)':'rgba(255,255,255,.12)')+';background:'+(first?'linear-gradient(180deg,rgba(245,184,46,.25),transparent)':'rgba(255,255,255,.03)')+';box-shadow:'+(first?'0 0 40px rgba(245,184,46,.3)':'none')+'">'+unitIcon(u.id,first?48:34)+'</span><b style="font-size:13px;margin-top:6px">'+u.short+'</b><b style="font-size:12px;color:'+(first?'var(--gold)':'#94A3B8')+'">'+u.points.toLocaleString('pt-BR')+' pts</b></button>'});
h+='</div><div class="panel">';
order.forEach(function(u,i){h+='<button class="evrow" onclick="go(\'unidade\',{unitId:\''+u.id+'\'})"><span class="check '+(i===0?'on':'')+'" style="'+(i===0?'':'background:rgba(255,255,255,.1)')+'font-size:12px;font-weight:900">'+(i+1)+'</span>'+unitIcon(u.id,24)+'<b style="font-size:13px">'+u.short+'</b><span style="margin-left:auto;text-align:right"><b style="font-size:13px">'+u.points.toLocaleString('pt-BR')+'</b><br>'+bar(Math.round(u.points/3016*100),i===0?'#F5B82E':(i===1?'#FB7185':'#38BDF8'))+'</span></button>'});
return h+'</div>';
}
function medalColor(t){return t==='OURO'?'#F5B82E':(t==='PRATA'?'#CBD5E1':'#F97316')}
function vPremiacoes(){
var h='<h2 style="font-size:20px;font-weight:900">Premiações</h2><p class="kv">Níveis configuráveis · Temporada 2026</p><div class="unitgrid">';
var lv=[['OURO','90% – 100%'],['PRATA','75% – 89%'],['BRONZE','60% – 74%']];
lv.forEach(function(l){h+='<div class="panel" style="text-align:center;margin-top:0;border-color:'+medalColor(l[0])+'55"><div style="color:'+medalColor(l[0])+'">'+ic('medal',36)+'</div><b style="color:'+medalColor(l[0])+'">'+l[0]+'</b><div class="kv">'+l[1]+'</div></div>'});
h+='</div>';
DB.units.forEach(function(u){var medal=u.rank===1?'Ouro':(u.rank===2?'Prata':'Bronze');h+='<div class="memberrow">'+unitIcon(u.id,26)+'<span style="flex:1"><b>'+u.short+'</b><br><span class="kv">'+u.req+'% média geral</span></span>'+awardPill(medal)+'</div>'});
return h+'<button class="btn2" style="width:100%;margin-top:12px" onclick="toast(\'Faixas salvas (protótipo)\')">Editar faixas de premiação</button>';
}
function vGaleria(){
var h='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:20px;font-weight:900">Galeria</h2><button class="tab active" onclick="openModal(\'foto\')">+ Adicionar foto</button></div><div class="tabs">';['Todos','Clube','Águias','Fênix','Stelar'].forEach(function(f){h+='<button class="tab '+(S.galF===f?'active':'')+'" onclick="S.galF=\''+f+'\';render()">'+f+'</button>'});h+='</div><h3 style="margin-top:14px;font-size:13px">Outubro 2026 · Reunião regular</h3><div class="gal">'+DB.gallery.slice(0,4).map(function(g){return '<img src="https://images.unsplash.com/'+g+'?auto=format&fit=crop&w=400&q=70">'}).join('')+'</div><h3 style="margin-top:14px;font-size:13px">Acampamento</h3><div class="gal">'+DB.gallery.slice(4).map(function(g){return '<img src="https://images.unsplash.com/'+g+'?auto=format&fit=crop&w=400&q=70">'}).join('')+'</div>';
return h;
}
function vRelatorios(){
var h='<h2 style="font-size:20px;font-weight:900">Relatórios</h2><p class="kv">Setembro / Outubro</p><div class="grid2" style="grid-template-columns:1fr 1fr"><div class="panel"><h3>Frequência das reuniões</h3>';
DB.freqHist.forEach(function(f){h+='<div class="chartbar"><span class="kv" style="width:40px">'+f[0]+'</span><div class="bar"><i style="width:'+f[1]+'%;background:linear-gradient(90deg,#009FE3,#38BDF8)"></i></div><b>'+f[1]+'%</b></div>'});
h+='</div><div class="panel"><h3>Participação em eventos</h3><div class="ringwrap" style="margin-top:10px;justify-content:center">'+ring(88,120,'#35D07F')+'</div><div class="kv" style="text-align:center;margin-top:8px">Águias 100% · Fênix 90% · Stelar 85%</div></div></div><div class="panel"><h3>Ranking de pontos</h3>';
DB.units.forEach(function(u){h+='<div class="chartbar">'+unitIcon(u.id,18)+'<span style="width:60px">'+u.short+'</span><div class="bar"><i style="width:'+Math.round(u.points/3016*100)+'%;background:#F5B82E"></i></div><b>'+u.points.toLocaleString('pt-BR')+'</b></div>'});
return h+'</div>';
}
function vConfig(){
var items=[['Perfil do clube','Logo, nome e temporada'],['Unidades','Águias, Fênix e Stelar'],['Usuários','Diretores e conselheiros'],['Permissões','Quem pode editar o quê'],['Temporadas','2026 e histórico'],['Premiações','Faixas Ouro/Prata/Bronze'],['Requisitos','Listas por categoria']];
var h='<h2 style="font-size:20px;font-weight:900">Configurações</h2><div class="panel"><div style="display:flex;gap:12px;align-items:center">'+logoHTML()+'<div><b>Esquadrão do Céu</b><div class="kv">Fundado em 2022 · Temporada 2026</div></div></div></div><div class="panel" style="padding:0">';
items.forEach(function(it){h+='<button class="evrow" style="padding:14px 18px" onclick="toast(\''+it[0]+'\')"><span><b style="font-size:13px">'+it[0]+'</b><br><span class="kv">'+it[1]+'</span></span><span style="margin-left:auto;color:#475569">'+ic('chev',16)+'</span></button>'});
return h+'</div>';
}
function vMais(){
var h='<h2 style="font-size:20px;font-weight:900">Mais</h2><div class="panel" style="display:flex;gap:12px;align-items:center"><img src="https://i.pravatar.cc/80?img=11" style="width:48px;height:48px;border-radius:50%"><div><b>Henrique Castro</b><div class="kv">Diretor do Clube</div></div></div><div class="panel" style="padding:0">';
[['Perfil do clube','config'],['Exportar relatórios','relatorios'],['Central de ajuda','config']].forEach(function(it){h+='<button class="evrow" style="padding:14px 18px" onclick="go(\''+it[1]+'\')"><b style="font-size:13px">'+it[0]+'</b><span style="margin-left:auto;color:#475569">'+ic('chev',16)+'</span></button>'});
h+='<button class="evrow" style="padding:14px 18px;color:#f87171" onclick="S.logged=false;render()"><b style="font-size:13px">Sair da conta</b></button></div><div class="cards2"><button class="panel" style="margin-top:0" onclick="go(\'missoes\')"><b>'+ic('spark',16)+' Missões</b></button><button class="panel" style="margin-top:0" onclick="go(\'premiacoes\')"><b>'+ic('medal',16)+' Premiações</b></button><button class="panel" style="margin-top:0" onclick="go(\'frequencia\')"><b>'+ic('shirt',16)+' Frequência</b></button><button class="panel" style="margin-top:0" onclick="go(\'requisitos\')"><b>'+ic('clip',16)+' Requisitos</b></button></div>';
return h;
}
function openModal(kind){
var r=document.getElementById('modal-root');
var body='';
if(kind==='evento'){body='<h3>Novo evento</h3><input id="m-name" class="field" placeholder="Nome do evento"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="field" placeholder="05/11/2026"><input class="field" placeholder="19:00"></div><input class="field" placeholder="Local — IASD Central"><div class="kv" style="margin-top:10px">Registrar frequência · Fardamento · Pontuação</div><button class="btn-primary" onclick="closeModal();toast(\'Evento criado com sucesso\')">Criar evento</button>'}
if(kind==='membro'){body='<h3>Adicionar membro</h3><input class="field" placeholder="Nome completo"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="field" placeholder="Idade"><input class="field" placeholder="Classe"></div><button class="btn-primary" onclick="closeModal();toast(\'Desbravador adicionado\')">Adicionar</button>'}
if(kind==='foto'){body='<h3>Adicionar foto</h3><div style="border:1.5px dashed rgba(255,255,255,.25);border-radius:14px;height:130px;display:grid;place-items:center;margin-top:10px;color:#94A3B8">'+ic('camera',36)+'</div><button class="btn-primary" onclick="closeModal();toast(\'Foto enviada\')">Enviar foto</button>'}
r.innerHTML='<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div style="text-align:right"><button onclick="closeModal()" aria-label="Fechar">'+ic('x',18)+'</button></div>'+body+'</div></div>';
}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
render();
</script>
</body>
